version: '3.8'

# Self-hosted observability stack for TradeMaster.
# Run with: docker compose -f docker-compose.observability.yml up -d
#
# Services exposed:
#   Grafana         http://localhost:3001  (default admin/admin)
#   GlitchTip       http://localhost:8000
#   Alloy OTLP      http://localhost:4318  (traces/metrics/logs)
#   Loki            http://localhost:3100
#   Tempo           http://localhost:3200
#   Mimir           http://localhost:3300
#
# PostHog is provided as an optional commented block at the bottom.

services:
  alloy:
    image: grafana/alloy:latest
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy
      - --server.http.listen-addr=0.0.0.0:12345
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "12345:12345" # Alloy UI
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy
    depends_on:
      - loki
      - tempo
      - mimir
    networks:
      - observability

  loki:
    image: grafana/loki:3.1.0
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - observability

  tempo:
    image: grafana/tempo:2.5.0
    restart: unless-stopped
    ports:
      - "3200:3200"   # Tempo HTTP
      - "9095:9095"   # Tempo gRPC
      - "4317"        # OTLP gRPC (internal)
    volumes:
      - ./observability/tempo/tempo-config.yml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    command: -config.file=/etc/tempo.yaml
    networks:
      - observability

  mimir:
    image: grafana/mimir:2.13.0
    restart: unless-stopped
    ports:
      - "3300:3300"
    volumes:
      - ./observability/mimir/mimir-config.yml:/etc/mimir.yaml:ro
      - mimir_data:/mimir
    command: -config.file=/etc/mimir.yaml
    networks:
      - observability

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_INSTALL_PLUGINS: "grafana-clock-panel"
    volumes:
      - ./observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki
      - tempo
      - mimir
    networks:
      - observability

  glitchtip-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: glitchtip
      POSTGRES_DB: glitchtip
    volumes:
      - glitchtip_postgres_data:/var/lib/postgresql/data
    networks:
      - observability

  glitchtip-redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - observability

  glitchtip:
    image: glitchtip/glitchtip:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://glitchtip:glitchtip@glitchtip-postgres:5432/glitchtip
      REDIS_URL: redis://glitchtip-redis:6379/0
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-change-me-in-production}
      GLITCHTIP_DOMAIN: http://localhost:8000
      DEFAULT_FROM_EMAIL: ${GLITCHTIP_FROM_EMAIL:-noreply@example.com}
      CELERY_WORKER_CONCURRENCY: 2
    depends_on:
      - glitchtip-postgres
      - glitchtip-redis
    networks:
      - observability

  # Uncomment the PostHog block below to enable self-hosted session replay + rage-click analytics.
  # It requires significant resources (ClickHouse, Kafka/Zookeeper, Redis, Postgres).
  # posthog-redis:
  #   image: redis:7-alpine
  #   networks:
  #     - observability
  #
  # posthog-postgres:
  #   image: postgres:16-alpine
