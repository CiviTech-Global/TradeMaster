volumes:
  alloy_data:
  loki_data:
  tempo_data:
  mimir_data:
  grafana_data:
  glitchtip_postgres_data:
  # posthog_postgres_data:
  # posthog_clickhouse_data:

networks:
  observability:
    driver: bridge
