multitenancy_enabled: false

server:
  http_listen_port: 3300
  grpc_listen_port: 9097

common:
  storage:
    backend: filesystem

blocks_storage:
  backend: filesystem
  filesystem:
    dir: /mimir/blocks
  tsdb:
    dir: /mimir/tsdb

compactor:
  data_dir: /mimir/compactor
  sharding_ring:
    kvstore:
      store: inmemory

distributor:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

ingester:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory
    replication_factor: 1

ruler:
  rule_path: /mimir/ruler
  alertmanager_url: http://localhost:9093
  ring:
    kvstore:
      store: inmemory

alertmanager:
  data_dir: /mimir/alertmanager
  sharding_ring:
    kvstore:
      store: inmemory

limits:
  ingestion_rate: 100000
  ingestion_burst_size: 200000
